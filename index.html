<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#052c4f">
  <title>Fish Evolution</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <main class="game-shell">
    <canvas id="gameCanvas" aria-label="Fish Evolution game"></canvas>
    <section class="hud" aria-label="Game status">
      <div class="title-row">
        <div class="title-wrap"><span class="label">Stage</span><strong id="stageName">Fry</strong></div>
        <div class="title-wrap"><span class="label">Eaten</span><strong id="eatenValue">0</strong></div>
        <div class="title-wrap"><span class="label">Score</span><strong id="scoreValue">0</strong></div>
        <button id="rebirthButton" class="rebirth-button" type="button">↻ <span>Rebirth</span></button>
      </div>
      <div class="meter-wrap"><div class="meter-head"><span>Evolution energy</span><span id="energyValue">0%</span></div><div class="meter-track"><div id="energyFill"></div></div></div>
    </section>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div class="controls-card">Move: WASD, arrows, or touch and drag</div>
  </main>
  <script src="game.js?v=5"></script>
</body>
</html>
