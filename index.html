<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#052c4f" />
    <title>Fish Evolution</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <div class="hud">
        <div class="title-row">
          <div class="title-wrap">
            <span class="label">Stage</span>
            <strong id="stageName">Fry</strong>
          </div>
          <div class="title-wrap right">
            <span class="label">Score</span>
            <strong id="scoreValue">0</strong>
          </div>
        </div>
        <div class="meter-wrap">
          <div class="meter-head">
            <span>Energy</span>
            <span id="energyValue">0%</span>
          </div>
          <div class="meter-track">
            <div id="energyFill"></div>
          </div>
        </div>
      </div>

      <canvas id="gameCanvas" aria-label="Fish evolution game"></canvas>

      <div class="controls-card">
        <div class="controls-text">Move with WASD, arrow keys, or drag/tap</div>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
