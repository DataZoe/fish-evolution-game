<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#052c4f">
  <title>Fish Evolution</title>
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body>
  <main class="game-shell">
    <canvas id="gameCanvas" aria-label="Fish Evolution game"></canvas>
    <section class="hud" aria-label="Game status">
      <div class="title-row">
        <div class="title-wrap"><span class="label">Stage</span><strong id="stageName">Fry</strong></div>
        <div class="title-wrap"><span class="label">Eaten</span><strong id="eatenValue">0</strong></div>
        <div class="title-wrap"><span class="label">Score</span><strong id="scoreValue">0</strong></div>
        <button id="rebirthButton" class="rebirth-button" type="button">↻ <span>Rebirth</span></button>
      </div>
      <div class="meter-wrap">
        <div class="meter-head"><span>Evolution energy</span><span id="energyValue">0%</span></div>
        <div class="meter-track"><div id="energyFill"></div></div>
      </div>
    </section>
    <div id="bossAlert" class="boss-alert" role="status" aria-live="polite">BOSS FISH APPROACHING!</div>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <nav class="touch-pad" aria-label="Touch movement controls">
      <button type="button" class="pad-up" data-key="ArrowUp" aria-label="Swim up">▲</button>
      <button type="button" class="pad-left" data-key="ArrowLeft" aria-label="Swim left">◀</button>
      <button type="button" class="pad-down" data-key="ArrowDown" aria-label="Swim down">▼</button>
      <button type="button" class="pad-right" data-key="ArrowRight" aria-label="Swim right">▶</button>
    </nav>
    <div class="controls-card">Move: WASD, arrows, or touch controls</div>
  </main>
  <script src="game.js?v=8"></script>
  <script>
    document.querySelectorAll('.touch-pad button').forEach((button) => {
      const key = button.dataset.key;
      const release = (event) => {
        if (event) event.preventDefault();
        window.dispatchEvent(new KeyboardEvent('keyup', { key, bubbles: true, cancelable: true }));
      };
      button.addEventListener('pointerdown', (event) => {
        event.preventDefault();
        button.setPointerCapture?.(event.pointerId);
        window.dispatchEvent(new KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
      });
      button.addEventListener('pointerup', release);
      button.addEventListener('pointercancel', release);
      button.addEventListener('lostpointercapture', release);
      button.addEventListener('contextmenu', (event) => event.preventDefault());
    });
  </script>
</body>
</html>
